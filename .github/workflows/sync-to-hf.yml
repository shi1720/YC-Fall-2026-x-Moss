# Mirrors main to the Hugging Face Space that serves the deployed agent.
# Secrets: HF_TOKEN (write). Variables: HF_SPACE (e.g. "username/raksha").
name: Deploy to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Space (with the Space README on top)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "raksha-bot"
          git config user.email "raksha-bot@users.noreply.github.com"
          git checkout -B hf-deploy
          cp hf/README.md README.md
          git add README.md
          git commit -m "chore: Space README" --quiet
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${{ vars.HF_SPACE }}" hf-deploy:main
