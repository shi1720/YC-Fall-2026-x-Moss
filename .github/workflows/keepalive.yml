# Free hosting sleeps after inactivity; a health ping every 10 minutes keeps the
# demo instantly available for judges. Set DEPLOY_URL in repository variables.
name: Keep the deployed shield warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 "${{ vars.DEPLOY_URL }}/api/health" | head -c 400
