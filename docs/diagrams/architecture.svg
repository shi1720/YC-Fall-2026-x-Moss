<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#06080f"/></linearGradient>
    <linearGradient id="saf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc75f"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f97ad"/></marker>
    <marker id="arrowMoss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrowSaf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5a524"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="960" fill="url(#bg)"/>
  <g opacity="0.06" stroke="#ffffff"><path d="M0 0H1600" stroke-width="0"/>
    <g id="grid">
      <path d="M100 0V960M200 0V960M300 0V960M400 0V960M500 0V960M600 0V960M700 0V960M800 0V960M900 0V960M1000 0V960M1100 0V960M1200 0V960M1300 0V960M1400 0V960M1500 0V960"/>
      <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600M0 900H1600"/>
    </g>
  </g>

  <!-- Title -->
  <g>
    <path d="M52 40 40 44.6v9c0 7.4 5 13.5 12 15.3 7-1.8 12-7.9 12-15.3v-9L52 40Z" fill="url(#saf)"/>
    <path d="M47.5 55 50.6 58l6.6-7" stroke="#06080f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="62" font-size="30" fill="#e8ebf3" font-weight="600" letter-spacing="-0.5">Raksha — system architecture</text>
    <text x="76" y="88" font-size="15" fill="#8f97ad">Real-time scam-call shield. One utterance in, one verdict out, in single-digit milliseconds — retrieval by Moss, in-process.</text>
  </g>

  <!-- Moss Cloud (top) -->
  <g>
    <rect x="560" y="120" width="480" height="118" rx="18" fill="#0f1523" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="584" y="150" font-size="12" fill="#34d399" letter-spacing="2.5" font-weight="700">MOSS CLOUD · CONTROL PLANE</text>
    <text x="584" y="176" font-size="15" fill="#e8ebf3">raksha-playbook   409 lines · moss-minilm · built once by <tspan fill="#ffd58a">npm run moss:seed</tspan></text>
    <text x="584" y="200" font-size="15" fill="#e8ebf3">raksha-intel   community reports · upserted at runtime</text>
    <text x="584" y="224" font-size="13" fill="#8f97ad">Ingest, embed, store, distribute immutable index snapshots. Never on the query path.</text>
  </g>

  <!-- Protected phone (left) -->
  <g>
    <rect x="60" y="300" width="330" height="360" rx="20" fill="#0f1523" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="84" y="330" font-size="12" fill="#f5a524" letter-spacing="2.5" font-weight="700">PROTECTED PHONE · BROWSER</text>
    <rect x="84" y="350" width="282" height="56" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="100" y="373" font-size="14" fill="#e8ebf3" font-weight="600">Speech → text on device</text>
    <text x="100" y="393" font-size="12" fill="#8f97ad">Web Speech API · Whisper for recordings</text>
    <rect x="84" y="418" width="282" height="76" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="100" y="441" font-size="14" fill="#e8ebf3" font-weight="600">Shield UI</text>
    <text x="100" y="461" font-size="12" fill="#8f97ad">risk dial · transcript with tactic chips</text>
    <text x="100" y="479" font-size="12" fill="#8f97ad">intervention overlay · spoken coaching (TTS)</text>
    <rect x="84" y="506" width="282" height="56" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="100" y="529" font-size="14" fill="#e8ebf3" font-weight="600">Simulation · Live mic · Recording</text>
    <text x="100" y="549" font-size="12" fill="#8f97ad">interim fragments every ~400 ms, finals on pause</text>
    <text x="84" y="600" font-size="12" fill="#5b637a">Nothing is recorded. Transcript fragments</text>
    <text x="84" y="618" font-size="12" fill="#5b637a">exist only for the life of the call.</text>
  </g>

  <!-- Server (center) -->
  <g>
    <rect x="450" y="290" width="700" height="560" rx="22" fill="#0b0f1a" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="474" y="322" font-size="12" fill="#8f97ad" letter-spacing="2.5" font-weight="700">RAKSHA SERVER · ONE NODE PROCESS (NEXT.JS + WEBSOCKET)</text>

    <!-- gateway -->
    <rect x="474" y="340" width="652" height="52" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="490" y="362" font-size="14" fill="#e8ebf3" font-weight="600">WebSocket gateway  /ws</text>
    <text x="490" y="381" font-size="12" fill="#8f97ad">shield sockets · guardian rooms keyed by family code · replay on late join</text>

    <!-- fast path -->
    <rect x="474" y="410" width="400" height="300" rx="14" fill="#0f1523" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="492" y="436" font-size="12" fill="#34d399" letter-spacing="2.5" font-weight="700">FAST PATH · EVERY FRAGMENT · ≈ 3 MS</text>
    <rect x="492" y="450" width="364" height="112" rx="10" fill="#151c2e" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="508" y="472" font-size="14" fill="#e8ebf3" font-weight="600">Moss runtime (in-process)</text>
    <text x="508" y="492" font-size="12" fill="#8f97ad">● loaded index  raksha-playbook   autoRefresh, hot-swap</text>
    <text x="508" y="510" font-size="12" fill="#8f97ad">● loaded index  raksha-intel        queryMultiIndex, one top-K</text>
    <text x="508" y="528" font-size="12" fill="#8f97ad">● per-call session  raksha-call-{id}   addDocs / query, never pushed</text>
    <text x="508" y="548" font-size="12" fill="#6ee7b7">embed + search locally · alpha 1.0 → raw cosine · topK 6</text>
    <rect x="492" y="574" width="364" height="120" rx="10" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="508" y="596" font-size="14" fill="#e8ebf3" font-weight="600">Risk engine (pure, unit-tested)</text>
    <text x="508" y="616" font-size="12" fill="#8f97ad">calibrate cosine → confidence · benign look-alike suppression</text>
    <text x="508" y="634" font-size="12" fill="#8f97ad">speaker-aware credit · noisy-OR over 21 tactics (evidence persists)</text>
    <text x="508" y="652" font-size="12" fill="#8f97ad">rule 1 · pressure + ask (the triad) ⇒ DANGER</text>
    <text x="508" y="670" font-size="12" fill="#8f97ad">rule 2 · victim about to comply under pressure ⇒ intervene now</text>
    <text x="508" y="688" font-size="12" fill="#8f97ad">intervention policy · targeted “do NOT read the OTP” messages</text>

    <!-- slow path -->
    <rect x="894" y="410" width="232" height="180" rx="14" fill="#0f1523" stroke="#f5a524" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <text x="912" y="436" font-size="12" fill="#f5a524" letter-spacing="2.5" font-weight="700">SLOW PATH · ASYNC</text>
    <text x="912" y="460" font-size="14" fill="#e8ebf3" font-weight="600">LLM coach</text>
    <text x="912" y="480" font-size="12" fill="#8f97ad">Groq · gpt-oss-20b</text>
    <text x="912" y="498" font-size="12" fill="#8f97ad">only on risk transitions</text>
    <text x="912" y="516" font-size="12" fill="#8f97ad">≈ 300–800 ms, never blocks</text>
    <text x="912" y="540" font-size="12" fill="#8f97ad">verdict · explanation</text>
    <text x="912" y="558" font-size="12" fill="#8f97ad">“say this” · next action</text>
    <text x="912" y="576" font-size="12" fill="#ffd58a">benign veto dampens CAUTION</text>

    <!-- community intel -->
    <rect x="894" y="606" width="232" height="104" rx="14" fill="#0f1523" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="912" y="632" font-size="12" fill="#8f97ad" letter-spacing="2.5" font-weight="700">COMMUNITY INTEL</text>
    <text x="912" y="656" font-size="12" fill="#e8ebf3">report → flagged caller lines</text>
    <text x="912" y="674" font-size="12" fill="#e8ebf3">addDocs(upsert) → raksha-intel</text>
    <text x="912" y="692" font-size="12" fill="#6ee7b7">every device hot-swaps it in</text>

    <!-- call manager -->
    <rect x="474" y="728" width="652" height="100" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="490" y="752" font-size="14" fill="#e8ebf3" font-weight="600">Call manager</text>
    <text x="490" y="772" font-size="12" fill="#8f97ad">per-call state in RAM: transcript · risk state · interventions · advice · latency p50/p95/p99</text>
    <text x="490" y="790" font-size="12" fill="#8f97ad">events → shield + guardians  ·  guardian.ask → session.query  ·  call end → summary, session closed, memory gone</text>
    <text x="490" y="812" font-size="12" fill="#5b637a">REST: /api/health · /api/playbook?q= · /api/scenarios · /api/transcribe · /api/eval</text>
  </g>

  <!-- Guardian (right) -->
  <g>
    <rect x="1210" y="300" width="330" height="360" rx="20" fill="#0f1523" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1234" y="330" font-size="12" fill="#f5a524" letter-spacing="2.5" font-weight="700">GUARDIAN · BROWSER</text>
    <rect x="1234" y="350" width="282" height="56" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="1250" y="373" font-size="14" fill="#e8ebf3" font-weight="600">Live risk of a protected phone</text>
    <text x="1250" y="393" font-size="12" fill="#8f97ad">dial · sparkline · transcript highlights</text>
    <rect x="1234" y="418" width="282" height="56" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="1250" y="441" font-size="14" fill="#e8ebf3" font-weight="600">Speak through the shield</text>
    <text x="1250" y="461" font-size="12" fill="#8f97ad">shown + read aloud on their phone</text>
    <rect x="1234" y="486" width="282" height="56" rx="12" fill="#151c2e" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="1250" y="509" font-size="14" fill="#e8ebf3" font-weight="600">Ask the call</text>
    <text x="1250" y="529" font-size="12" fill="#8f97ad">semantic recall from the Moss session</text>
    <text x="1234" y="580" font-size="12" fill="#5b637a">Human and agent share the same</text>
    <text x="1234" y="598" font-size="12" fill="#5b637a">session context — multiplayer by design.</text>
  </g>

  <!-- Arrows -->
  <!-- phone -> gateway -->
  <path d="M390 440 C430 440 430 366 474 366" fill="none" stroke="#8f97ad" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="392" font-size="11" fill="#8f97ad">utterance</text>
  <path d="M474 386 C430 386 430 470 390 470" fill="none" stroke="#f5a524" stroke-width="2" marker-end="url(#arrowSaf)"/>
  <text x="396" y="500" font-size="11" fill="#ffd58a">analysis · risk · intervention</text>
  <!-- gateway -> guardian -->
  <path d="M1126 366 C1170 366 1170 380 1210 380" fill="none" stroke="#f5a524" stroke-width="2" marker-end="url(#arrowSaf)"/>
  <path d="M1210 446 C1170 446 1170 386 1126 386" fill="none" stroke="#8f97ad" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1134" y="410" font-size="11" fill="#8f97ad">say · ask</text>
  <!-- cloud -> runtime (load) -->
  <path d="M700 238 C700 300 640 300 640 410" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowMoss)"/>
  <text x="530" y="272" font-size="11" fill="#6ee7b7">loadIndex at boot · poll every 120 s · hot-swap</text>
  <!-- intel -> cloud -->
  <path d="M1010 606 C1010 560 1180 560 1180 300 C1180 250 1100 240 1040 200" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowMoss)"/>
  <text x="1188" y="262" font-size="11" fill="#6ee7b7">addDocs (upsert)</text>

  <!-- Latency budget footer -->
  <g>
    <rect x="60" y="878" width="1480" height="52" rx="14" fill="#0f1523" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="84" y="899" font-size="12" fill="#8f97ad" letter-spacing="2.5" font-weight="700">LATENCY BUDGET FOR ONE SPOKEN SENTENCE (≈ 2,500 MS)</text>
    <text x="84" y="919" font-size="13" fill="#e8ebf3">speech → text ≈ 200–400 ms (streaming)   ·   <tspan fill="#6ee7b7">Moss embed + search ≈ 2–5 ms</tspan>   ·   risk engine &lt; 0.1 ms   ·   WebSocket round-trip ≈ 20–80 ms   ·   coach (async) ≈ 300–800 ms, off the critical path</text>
  </g>
</svg>
